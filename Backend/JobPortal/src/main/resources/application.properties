# ---------- Database (MySQL) ----------
# createDatabaseIfNotExist=true lets MySQL create the 'jobhub' database on first run.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/jobhub?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate creates/updates the tables automatically (fine for development).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# ---------- JWT ----------
jwt.secret=${JWT_SECRET}
# 24 hours in milliseconds
jwt.expiration=86400000

# ---------- Cloudinary (resume + profile picture upload) ----------
# The app boots with the demo values, but uploads only work with your own free Cloudinary keys.
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:demo}
cloudinary.api-key=${CLOUDINARY_API_KEY:demo}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:demo}

# ---------- Email (status-change emails) ----------
# Defaults let the app start; emails only send once you set a real SMTP server in .env.
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:3025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}
app.email.from=${MAIL_FROM:noreply@jobhub.local}
app.email.name=${MAIL_FROM_NAME:JobHub}

# ---------- File upload size ----------
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
